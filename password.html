<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#17151d">
    <title>A Little Secret | For Anikha</title>
    <style>
        :root {
            color-scheme: dark;
            --ink: #f7eef0;
            --muted: #c9bcc9;
            --rose: #eea8bb;
            --gold: #e9d39f;
            --serif: Georgia, 'Times New Roman', serif;
            --sans: 'Trebuchet MS', Arial, sans-serif;
        }

        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        body {
            position: relative;
            display: grid;
            min-height: 100vh;
            min-height: 100svh;
            margin: 0;
            padding: max(24px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
            overflow-x: hidden;
            place-items: center;
            isolation: isolate;
            background: linear-gradient(155deg, #191720, #211b29 48%, #18151e);
            color: var(--ink);
            font-family: var(--sans);
            line-height: 1.6;
        }
        body::before, body::after { position: fixed; z-index: -1; inset: 0; content: ''; pointer-events: none; }
        body::before {
            background:
                radial-gradient(ellipse at 18% 22%, rgba(180,137,177,0.18), transparent 38%),
                radial-gradient(ellipse at 83% 75%, rgba(213,168,135,0.13), transparent 36%),
                repeating-linear-gradient(0deg, rgba(255,255,255,0.018) 0 1px, transparent 1px 3px),
                repeating-linear-gradient(90deg, transparent 0 48px, rgba(201,184,222,0.018) 49px, transparent 50px 96px);
            animation: lofi-glow 18s ease-in-out infinite alternate;
        }
        body::after {
            background-image: radial-gradient(rgba(247,238,240,0.32) 0.7px, transparent 0.9px);
            background-size: 44px 44px;
            opacity: 0.22;
            animation: star-drift 70s linear infinite;
        }
        button, a { font: inherit; }
        a { color: inherit; }
        a:focus-visible, button:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
        .secret-page { width: min(100%, 820px); text-align: center; animation: page-arrive 650ms ease both; }
        .secret-mark { display: grid; width: 54px; height: 54px; place-items: center; margin: 0 auto 17px; border: 1px solid rgba(233,211,159,0.45); border-radius: 50%; background: rgba(233,211,159,0.08); box-shadow: 0 0 28px rgba(238,168,187,0.16); color: var(--gold); font-size: 25px; }
        .eyebrow { margin: 0 0 9px; color: var(--gold); font-size: 10px; font-weight: 700; letter-spacing: 0.22em; }
        h1, h2, p { margin-top: 0; }
        h1 { margin-bottom: 12px; color: #f4c9d5; font-family: var(--serif); font-size: clamp(36px, 8vw, 58px); font-weight: 500; letter-spacing: -0.035em; line-height: 1.08; }
        .intro { max-width: 490px; margin: 0 auto 30px; color: var(--muted); font-size: 14px; }
        .card-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; perspective: 1200px; }
        .secret-card { min-width: 0; height: 230px; padding: 0; border: 0; border-radius: 21px; background: transparent; color: var(--ink); cursor: pointer; text-align: left; -webkit-tap-highlight-color: transparent; }
        .secret-card:disabled { cursor: default; }
        .card-inner { position: relative; display: block; width: 100%; height: 100%; border-radius: inherit; transform-style: preserve-3d; transition: transform 700ms cubic-bezier(0.2,0.72,0.2,1); }
        .secret-card.is-flipped .card-inner { transform: rotateY(180deg); }
        .card-face { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 22px; overflow: hidden; border: 1px solid rgba(229,212,239,0.22); border-radius: inherit; background: linear-gradient(145deg, rgba(55,47,70,0.94), rgba(32,29,43,0.96)); box-shadow: 0 18px 48px rgba(0,0,0,0.3), inset 0 1px rgba(255,255,255,0.08); text-align: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        .card-face::before { position: absolute; inset: 9px; border: 1px solid rgba(233,211,159,0.13); border-radius: 14px; content: ''; pointer-events: none; }
        .card-front { gap: 8px; }
        .card-front::after { position: absolute; top: -50px; right: -44px; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, rgba(238,168,187,0.16), transparent 70%); content: ''; }
        .card-symbol { color: var(--gold); font-size: 37px; line-height: 1; text-shadow: 0 0 24px rgba(233,211,159,0.24); }
        .card-front strong { color: #f3cfdb; font-family: var(--serif); font-size: 22px; font-weight: 500; }
        .card-front small { color: var(--muted); font-size: 11px; }
        .card-back { transform: rotateY(180deg); }
        .card-back strong { position: relative; margin-bottom: 9px; color: #f3cfdb; font-family: var(--serif); font-size: 22px; font-weight: 500; }
        .card-back p { position: relative; margin: 0; color: var(--muted); font-size: 13px; }
        .password-reveal { display: inline-block; margin: 6px 0; padding: 6px 12px; border: 1px solid rgba(233,211,159,0.3); border-radius: 9px; background: rgba(233,211,159,0.08); color: #ffe8ad; font-family: ui-monospace, Consolas, monospace; font-size: 18px; font-weight: 700; letter-spacing: 0.06em; }
        .status { min-height: 28px; margin: 20px 0 0; color: #f3cfdb; font-size: 13px; }
        .home-link { display: inline-flex; min-height: 50px; align-items: center; justify-content: center; margin-top: 4px; padding: 11px 22px; border: 1px solid rgba(255,235,229,0.72); border-radius: 999px; background: linear-gradient(110deg, #e99eb5, #efc7b1 64%, #ecd7a8); box-shadow: 0 8px 26px rgba(0,0,0,0.22); color: #241a24; font-size: 13px; font-weight: 700; text-decoration: none; transition: transform 180ms ease, box-shadow 180ms ease; }
        .home-link:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0,0,0,0.3); }
        .back-link { display: block; width: fit-content; min-height: 44px; margin: 17px auto 0; padding: 8px 12px; color: var(--muted); font-size: 12px; text-decoration-color: rgba(201,188,201,0.4); text-underline-offset: 4px; }
        @keyframes lofi-glow { from { transform: scale(1) translate3d(-1%, 0, 0); } to { transform: scale(1.08) translate3d(1%, 1%, 0); } }
        @keyframes star-drift { from { background-position: 0 0; } to { background-position: 88px 132px; } }
        @keyframes page-arrive { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 560px) {
            body { padding-right: max(16px, env(safe-area-inset-right)); padding-left: max(16px, env(safe-area-inset-left)); }
            .secret-page { max-width: 390px; }
            .intro { margin-bottom: 23px; }
            .card-grid { grid-template-columns: 1fr; gap: 13px; }
            .secret-card { height: 172px; }
            .card-face { padding: 16px; }
            .card-symbol { font-size: 31px; }
            .card-front strong, .card-back strong { font-size: 20px; }
            .status { margin-top: 16px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <main class="secret-page">
        <span class="secret-mark" aria-hidden="true">✧</span>
        <p class="eyebrow">A LITTLE LO-FI MYSTERY</p>
        <h1>Two little secrets</h1>
        <p class="intro">Pick a card and turn it over. One is a little miss, but the other has the special word waiting for you.</p>

        <div class="card-grid" aria-label="Choose a secret card">
            <button class="secret-card" type="button" data-correct="false" aria-label="Open the moon card" aria-pressed="false">
                <span class="card-inner">
                    <span class="card-face card-front">
                        <span class="card-symbol" aria-hidden="true">☾</span>
                        <strong>The Moon Note</strong>
                        <small>Tap to turn your card</small>
                    </span>
                    <span class="card-face card-back" aria-hidden="true">
                        <strong>Oh, unlucky pick!</strong>
                        <p>Not this one, Anikha. Try the other card for your special word.</p>
                    </span>
                </span>
            </button>
            <button class="secret-card" type="button" data-correct="true" aria-label="Open the star card" aria-pressed="false">
                <span class="card-inner">
                    <span class="card-face card-front">
                        <span class="card-symbol" aria-hidden="true">✦</span>
                        <strong>The Star Note</strong>
                        <small>Tap to turn your card</small>
                    </span>
                    <span class="card-face card-back" aria-hidden="true">
                        <strong>Your special word</strong>
                        <span class="password-reveal">queenofjune</span>
                        <p>For the queen of June. ♡</p>
                    </span>
                </span>
            </button>
        </div>

        <p id="cardStatus" class="status" role="status" aria-live="polite"></p>
        <a id="homeLink" class="home-link" href="index.html" hidden>Go to home</a>
        <a class="back-link" href="index.html">Back to the entrance</a>
    </main>
    <script>
        const cards = Array.from(document.querySelectorAll('.secret-card'));
        const status = document.getElementById('cardStatus');
        const homeLink = document.getElementById('homeLink');

        cards.forEach(card => {
            card.addEventListener('click', () => {
                if (card.classList.contains('is-flipped')) return;
                card.classList.add('is-flipped');
                card.setAttribute('aria-pressed', 'true');
                card.setAttribute('aria-label', card.dataset.correct === 'true' ? 'Star card revealed. Special word found.' : 'Moon card revealed. Try the other card.');
                card.querySelector('.card-front').setAttribute('aria-hidden', 'true');
                card.querySelector('.card-back').setAttribute('aria-hidden', 'false');
                card.disabled = true;

                if (card.dataset.correct === 'true') {
                    status.textContent = 'You found it! Remember the word, then head back to the entrance.';
                    window.setTimeout(() => {
                        homeLink.hidden = false;
                    }, window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 720);
                } else {
                    status.textContent = 'Oops, unlucky pick! The other card has a little surprise for you.';
                }
            });
        });
    </script>
</body>
</html>
